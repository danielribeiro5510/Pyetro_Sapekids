{% extends "base.html" %}{% block title %}{{ 'Editar' if supplier else 'Novo' }} fornecedor · Pyetro Sapekids{% endblock %}{% block content %}<div class="mb-4"><h1 class="page-title h2">{{ 'Editar fornecedor' if supplier else 'Novo fornecedor' }}</h1></div><div class="card p-4"><form method="post" class="row g-3"><div class="col-md-6"><label class="form-label fw-semibold">Nome</label><input class="form-control" name="name" required value="{{ supplier.name if supplier else '' }}"></div><div class="col-md-3"><label class="form-label">CNPJ</label><input class="form-control" name="cnpj" value="{{ supplier.cnpj if supplier else '' }}"></div><div class="col-md-3"><label class="form-label">Telefone</label><input class="form-control" name="phone" value="{{ supplier.phone if supplier else '' }}"></div><div class="col-md-4"><label class="form-label">WhatsApp</label><input class="form-control" name="whatsapp" value="{{ supplier.whatsapp if supplier else '' }}"></div><div class="col-md-4"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" value="{{ supplier.email if supplier else '' }}"></div><div class="col-md-4"><label class="form-label">Endereço</label><input class="form-control" name="address" value="{{ supplier.address if supplier else '' }}"></div><div class="col-12"><button class="btn btn-success">Salvar</button> <a class="btn btn-light border" href="{{ url_for('suppliers') }}">Cancelar</a></div></form></div>{% endblock %}
