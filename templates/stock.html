{% extends "base.html" %}{% block content %}<h2>Estoque: {{ product.name }}</h2><div class="card p-4 mt-3"><h4>Registrar movimentação</h4><form method="post" class="row g-3"><div class="col-md-4"><select class="form-select" name="type"><option value="ENTRADA">Entrada</option><option value="SAIDA">Saída</option></select></div><div class="col-md-3"><input class="form-control" type="number" min="1" name="quantity" placeholder="Quantidade" required></div><div class="col-md-5"><input class="form-control" name="note" placeholder="Observação"></div><div class="col-12"><button class="btn btn-primary">Registrar</button></div></form></div><div class="card p-4 mt-3"><h4>Histórico</h4><table class="table"><tr><th>Tipo</th><th>Quantidade</th><th>Observação</th><th>Data</th></tr>{% for m in movements %}<tr><td>{{ m.type }}</td><td>{{ m.quantity }}</td><td>{{ m.note or '-' }}</td><td>{{ m.created_at }}</td></tr>{% endfor %}</table></div>{% endblock %}
