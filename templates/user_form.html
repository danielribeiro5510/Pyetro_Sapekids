{% extends "base.html" %}
{% block title %}{{ 'Editar usuário' if user else 'Novo usuário' }} · Pyetro Sapekids{% endblock %}
{% block content %}
<div class="mb-4">
  <h1 class="page-title h2 mb-1"><i class="bi bi-person-gear me-1"></i> {{ 'Editar usuário' if user else 'Novo usuário' }}</h1>
  <div class="page-subtitle">Defina o acesso do usuário ao sistema.</div>
</div>
<div class="card p-4" style="max-width:700px">
<form method="post">
  <div class="mb-3">
    <label class="form-label fw-semibold">Usuário</label>
    <input class="form-control" name="username" value="{{ user.username if user else '' }}" {% if user %}readonly{% else %}required{% endif %}>
  </div>
  <div class="mb-3">
    <label class="form-label fw-semibold">Perfil</label>
    <select class="form-select" name="role">
      <option value="operator" {% if user and user.role == 'operator' %}selected{% endif %}>Operador</option>
      <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>ADM</option>
    </select>
  </div>
  <div class="mb-4">
    <label class="form-label fw-semibold">Senha {% if user %}<span class="text-secondary fw-normal">(deixe em branco para manter)</span>{% endif %}</label>
    <input class="form-control" type="password" name="password" {% if not user %}required{% endif %}>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-dark"><i class="bi bi-check2 me-1"></i> Salvar</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('admin_users') }}">Cancelar</a>
  </div>
</form>
</div>
{% endblock %}
