<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Pyetro Sapekids</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{min-height:100vh;background:linear-gradient(135deg,#f5f3ff,#fff7fa);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.login-card{max-width:430px;border:1px solid #eee;box-shadow:0 20px 60px rgba(50,40,100,.12);border-radius:24px}
.logo{width:78px;height:78px;object-fit:contain;border-radius:20px;background:#111;padding:5px}
.form-control{border-radius:12px;padding:.8rem 1rem}
.btn-login{background:#6c63ff;border:0;border-radius:12px;padding:.8rem;font-weight:700}
.btn-login:hover{background:#5148e5}
</style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<div class="card login-card w-100">
<div class="card-body p-4 p-md-5">
<div class="text-center mb-4">
<img class="logo mb-3" src="{{ url_for('logo') }}" alt="Pyetro Sapekids">
<h1 class="h3 fw-bold mb-1">Pyetro <span style="color:#6c63ff">Sapekids</span></h1>
<p class="text-secondary mb-0">Acesse o sistema da loja</p>
</div>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
{% endwith %}
<form method="post">
<label class="form-label fw-semibold">Usuário</label>
<div class="input-group mb-3"><span class="input-group-text bg-white"><i class="bi bi-person"></i></span><input class="form-control" name="username" autocomplete="username" required></div>
<label class="form-label fw-semibold">Senha</label>
<div class="input-group mb-4"><span class="input-group-text bg-white"><i class="bi bi-lock"></i></span><input class="form-control" type="password" name="password" autocomplete="current-password" required></div>
<button class="btn btn-login btn-primary text-white w-100"><i class="bi bi-box-arrow-in-right me-1"></i> Entrar</button>
</form>
</div></div>
</body></html>
