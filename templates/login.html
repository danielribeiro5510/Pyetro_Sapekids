<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pyetro Sapekids</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f6f8}.login{max-width:440px;margin:10vh auto}.card{border:1px solid #e8e8ec;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.07)}</style></head><body><div class="container"><div class="login"><div class="card p-4"><div class="text-center mb-4"><div class="fs-2 fw-bold">🛍️ Pyetro Sapekids</div><div class="text-secondary">Acesso ao sistema</div></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><label class="form-label">Usuário</label><input class="form-control mb-3" name="username" autocomplete="username" required><label class="form-label">Senha</label><input class="form-control mb-4" type="password" name="password" autocomplete="current-password" required><button class="btn btn-dark w-100">Entrar</button></form></div></div></div></body></html>
