{% extends "base.html" %}{% block title %}Ajustar estoque · Pyetro Sapekids{% endblock %}{% block content %}<div class="mb-4"><h1 class="page-title h2">Ajustar estoque</h1><div class="page-subtitle">{{ product.name }} · estoque atual: <strong>{{ product.stock }}</strong></div></div><div class="card p-4"><form method="post" class="row g-3"><div class="col-md-4"><label class="form-label fw-semibold">Novo estoque</label><input class="form-control" type="number" min="0" name="target_stock" value="{{ product.stock }}" required></div><div class="col-md-8"><label class="form-label fw-semibold">Motivo</label><input class="form-control" name="note" placeholder="Ex.: inventário físico"></div><div class="col-12"><button class="btn btn-primary">Aplicar ajuste</button> <a class="btn btn-light border" href="{{ url_for('stock',product_id=product.id) }}">Cancelar</a></div></form></div>{% endblock %}
