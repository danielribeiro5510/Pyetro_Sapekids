{% extends "base.html" %}{% block content %}<h2>{{ 'Editar produto' if product else 'Novo produto' }}</h2><div class="card p-4 mt-3"><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" name="name" value="{{ product.name if product else '' }}" required></div><div class="col-md-3"><label class="form-label">Categoria</label><select class="form-select" name="category">{% for c in ['Roupa','Calçado','Acessório','Outro'] %}<option {% if product and product.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Marca</label><input class="form-control" name="brand" value="{{ product.brand if product else '' }}"></div><div class="col-md-4"><label class="form-label">Cor</label><input class="form-control" name="color" value="{{ product.color if product else '' }}"></div><div class="col-md-4"><label class="form-label">Tamanho</label><input class="form-control" name="size" value="{{ product.size if product else '' }}"></div><div class="col-md-4"><label class="form-label">Preço</label><input class="form-control" type="number" step="0.01" name="price" value="{{ product.price if product else 0 }}"></div>{% if not product %}<div class="col-md-6"><label class="form-label">Estoque inicial</label><input class="form-control" type="number" min="0" name="stock" value="0"></div>{% endif %}<div class="col-md-6"><label class="form-label">Estoque mínimo</label><input class="form-control" type="number" min="0" name="min_stock" value="{{ product.min_stock if product else 0 }}"></div></div><div class="mt-4"><button class="btn btn-success">Salvar</button></div></form></div>{% endblock %}
