{% extends "base.html" %}{% block title %}Troca / devolução · Pyetro Sapekids{% endblock %}{% block content %}<div class="mb-4"><h1 class="page-title h2">Troca / devolução — Venda #{{ sale.sale_number or sale.id }}</h1><div class="page-subtitle">O estoque é ajustado automaticamente. Em trocas, a diferença deve ser tratada no caixa.</div></div><div class="card p-4"><form method="post" class="row g-3"><div class="col-md-4"><label class="form-label fw-semibold">Tipo</label><select class="form-select" name="type"><option value="DEVOLUCAO">Devolução</option><option value="TROCA">Troca</option></select></div><div class="col-md-8"><label class="form-label fw-semibold">Produto vendido</label><select class="form-select" name="sale_item_id" required>{% for i in items %}<option value="{{ i.id }}">{{ i.name }} · R$ {{ '%.2f'|format(i.unit_price) }} · vendido: {{ i.quantity }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Quantidade devolvida</label><input class="form-control" type="number" min="1" name="quantity" value="1" required></div><div class="col-md-5"><label class="form-label">Produto de troca (opcional)</label><select class="form-select" name="replacement_product_id"><option value="">Nenhum</option>{% for p in products %}<option value="{{ p.id }}">{{ p.name }} · R$ {{ '%.2f'|format(p.price) }} · estoque {{ p.stock }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Qtd. troca</label><input class="form-control" type="number" min="0" name="replacement_quantity" value="0"></div><div class="col-md-12"><label class="form-label">Motivo</label><input class="form-control" name="reason" placeholder="Ex.: tamanho incorreto"></div><div class="col-12"><button class="btn btn-warning">Registrar operação</button> <a class="btn btn-light border" href="{{ url_for('sale_detail',sale_id=sale.id) }}">Cancelar</a></div></form></div>{% endblock %}
