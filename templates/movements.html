{% extends "base.html" %}{% block content %}<h2>Movimentações</h2><div class="card p-4 mt-3"><table class="table"><tr><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Observação</th><th>Data</th></tr>{% for m in movements %}<tr><td>{{ m.name }}</td><td>{{ m.type }}</td><td>{{ m.quantity }}</td><td>{{ m.note or '-' }}</td><td>{{ m.created_at }}</td></tr>{% else %}<tr><td colspan="5">Nenhuma movimentação.</td></tr>{% endfor %}</table></div>{% endblock %}
