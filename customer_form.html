{% extends "base.html" %}
{% block title %}{{ 'Editar cliente' if customer else 'Novo cliente' }} · Pyetro Sapekids{% endblock %}
{% block content %}
<div class="mb-4"><h1 class="fw-bold mb-1">{{ 'Editar cliente' if customer else 'Novo cliente' }}</h1><p class="text-muted mb-0">Mantenha os dados do cliente atualizados.</p></div>
<div class="card p-4"><form method="post" class="row g-3"><input type="hidden" name="return_to" value="{{ return_to|default('') }}">
<div class="col-md-6"><label class="form-label fw-semibold">Nome *</label><input class="form-control" name="name" value="{{ customer.name if customer else '' }}" required></div>
<div class="col-md-3"><label class="form-label fw-semibold">CPF</label><input class="form-control" name="cpf" value="{{ customer.cpf if customer else '' }}"></div>
<div class="col-md-3"><label class="form-label fw-semibold">Telefone</label><input class="form-control" name="phone" value="{{ customer.phone if customer else '' }}"></div>
<div class="col-md-4"><label class="form-label fw-semibold">WhatsApp</label><input class="form-control" name="whatsapp" value="{{ customer.whatsapp if customer else '' }}"></div>
<div class="col-md-8"><label class="form-label fw-semibold">Endereço</label><input class="form-control" name="address" value="{{ customer.address if customer else '' }}"></div>
<div class="col-md-4"><label class="form-label fw-semibold">Data de nascimento</label><input class="form-control" type="date" name="birth_date" value="{{ customer.birth_date if customer else '' }}"></div>
<div class="col-12"><label class="form-label fw-semibold">Observações</label><textarea class="form-control" name="notes" rows="3" placeholder="Preferências, observações ou informações úteis">{{ customer.notes if customer else '' }}</textarea></div>
<div class="col-12 d-flex gap-2"><a href="{{ url_for('customers') }}" class="btn btn-outline-secondary">Cancelar</a><button class="btn btn-success"><i class="bi bi-check-circle me-1"></i>Salvar cliente</button></div>
</form></div>
{% endblock %}
