{% extends "base.html" %}{% block title %}Categorias · Pyetro Sapekids{% endblock %}{% block content %}<div class="mb-4"><h1 class="page-title h2">Categorias</h1><div class="page-subtitle">Categorias configuráveis do catálogo.</div></div><div class="card p-4 mb-4"><form method="post" class="row g-2"><div class="col-md-8"><input class="form-control" name="name" placeholder="Nova categoria" required></div><div class="col-md-2"><button class="btn btn-success w-100">Adicionar</button></div></form></div><div class="card p-3"><table class="table"><thead><tr><th>Categoria</th><th>Ação</th></tr></thead><tbody>{% for c in categories %}<tr><td>{{ c.name }}</td><td><form method="post" action="{{ url_for('delete_category',category_id=c.id) }}"><button class="btn btn-sm btn-outline-danger">Excluir</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
